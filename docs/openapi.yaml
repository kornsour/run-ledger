openapi: 3.0.3
info:
  title: run-ledger
  description: >
    Content-addressed ledger for experiment runs. Identity fields (project,
    git_commit, git_dirty, config_hash, dataset_version, model_version, seed,
    params) determine a run's fingerprint; provenance fields (host, device,
    framework_version, submitter_claim, job_id, status, timestamps,
    checkpoint_uri, metrics, capture) record what happened without affecting
    it. capture is a declaration of what the client attempted to capture, not
    what it captured -- see ADR 0016 and the Run schema's capture
    description. See the repository README for the full model.
  version: "1.0.0"
  license:
    name: MIT
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: http://localhost:8080

security:
  - bearerAuth: []
  - {}

paths:
  /v1/runs:
    post:
      operationId: recordRun
      summary: Record a run
      description: >
        The server computes the fingerprint from the identity fields and
        assigns run_id when the caller does not supply one. Unknown JSON
        fields are rejected.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInput"
            example:
              project: demo
              git_commit: a1b2c3d
              git_dirty: false
              config_hash: cfg1
              dataset_version: v1
              model_version: v1
              seed: 1
              params:
                lr: "3e-4"
              device: cpu
              framework_version: torch-2.3.0
              capture:
                client: runledger-py/0.1.0
                attempted: [host, device, framework_version]
              status: created
      responses:
        "201":
          description: Run recorded
          headers:
            Location:
              description: /v1/runs/{run_id} of the newly recorded run.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Invalid run record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token is valid but lacks write scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicting run already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Content-Type is missing or not application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listRuns
      summary: List runs
      description: >
        Paginated, newest-first by started_at then run_id. Unrecognized
        query parameters are rejected rather than silently ignored.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: project
          in: query
          schema:
            type: string
        - name: git_commit
          in: query
          schema:
            type: string
        - name: fingerprint
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
        - name: device
          in: query
          schema:
            type: string
        - name: submitter_claim
          in: query
          description: >
            Filter to runs whose submitter_claim matches exactly. This is
            self-asserted, not attested (see the Run schema's
            submitter_claim description) -- filtering by it finds runs a
            caller claimed as theirs, not runs cryptographically proven to
            be theirs.
          schema:
            type: string
        - name: job_id
          in: query
          description: Filter to runs whose job_id matches exactly.
          schema:
            type: string
        - name: capture_client
          in: query
          description: >
            Filter to runs whose capture.client matches exactly (e.g.
            runledger-py/0.1.0) -- isolates every run one client version
            recorded, for questions like "did capture coverage regress in
            client X.Y". A run with no capture declaration never matches.
          schema:
            type: string
        - name: since
          in: query
          description: >
            Restrict to runs started at or after this instant (inclusive).
            May be combined with until and any other filter.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: >
            Restrict to runs started strictly before this instant
            (exclusive), so a run started exactly at the boundary shared by
            an adjacent since/until pair is never double-counted or skipped.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: >
            Page size. Defaults to 50. A value over 500 is not rejected --
            it is clamped down to 500, and the response's own limit field
            reports the value actually used.
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          description: >
            Opaque pagination token from a previous page's next_cursor.
            Format is not part of the API contract.
          schema:
            type: string
      responses:
        "200":
          description: A page of runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The store failed to answer the query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/runs/{id}:
    get:
      operationId: getRun
      summary: Get one run
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No run with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The store failed to answer the query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateRun
      summary: Update a run's provenance
      description: >
        Moves a run's provenance forward: status, ended_at, checkpoint_uri,
        metrics, host, device, framework_version, submitter_claim, job_id.
        Status transitions are restricted to created -> running ->
        {succeeded, failed, cancelled}; a terminal status cannot be left.
        Identity fields may be included only to confirm they are unchanged
        -- sending one that differs from the stored value is rejected as a
        conflict rather than silently ignored. capture is deliberately not
        patchable: it describes what the recording client's own code tried,
        which it already knows in full at record time, so there is no
        legitimate "fill this in later" case the way there is for the fields
        above (see ADR 0016).
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunPatch"
            example:
              status: succeeded
              ended_at: "2026-08-28T12:00:00Z"
              checkpoint_uri: s3://bucket/ckpt
              metrics:
                loss: 0.42
      responses:
        "200":
          description: The updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Invalid patch, or an illegal status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token is valid but lacks write scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No run with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Identity field in the patch conflicts with the stored run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Content-Type is missing or not application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/comparisons:
    get:
      operationId: compareRuns
      summary: Structured diff of two runs
      description: >
        A comparison is addressed by the pair of run ids being compared (a,
        b), not owned by either run -- this sits next to /v1/runs and
        /v1/fingerprints as its own resource collection rather than a verb
        hanging off the root.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: a
          in: query
          required: true
          schema:
            type: string
        - name: b
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResult"
        "400":
          description: Missing a or b
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Run a or b not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The store failed to answer the query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/fingerprints:
    get:
      operationId: listFingerprintSpread
      summary: Fingerprints ranked by widest relative metric spread
      description: >
        Paginated, ranked by widest relative metric spread descending, ties
        broken by fingerprint for a deterministic, resumable order. Defaults
        to fingerprints with more than one recorded run (min_runs=2); pass
        min_runs=1 or min_runs=0 to also see fingerprints with no repeats --
        the same runs GET /v1/fingerprints/{fingerprint} already reports for
        them as no_repeats, so this is what keeps the two endpoints'
        membership consistent. Unrecognized query parameters are rejected
        rather than silently ignored. Only terminal runs (succeeded, failed,
        cancelled) count toward a fingerprint's group or its min_runs
        threshold -- a created or running run has not produced a finished
        measurement yet, so it does not count as a repeat, but it is not
        dropped either: it is reported on the group's in_flight count.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: project
          in: query
          description: Restrict to one project; omitted ranks across every project.
          schema:
            type: string
        - name: min_runs
          in: query
          description: >
            Minimum run count a fingerprint's group must have to be
            included. Defaults to 2 (only fingerprints with repeats); 0 or 1
            also include fingerprints with no repeats.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          description: >
            Page size. Defaults to 50. A value over 500 is not rejected --
            it is clamped down to 500, and the response's own limit field
            reports the value actually used.
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          description: >
            Opaque pagination token from a previous page's next_cursor.
            Format is not part of the API contract.
          schema:
            type: string
      responses:
        "200":
          description: A page of ranked spread groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpreadGroupList"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The store failed to answer the query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/fingerprints/{fingerprint}:
    get:
      operationId: getFingerprintSpread
      summary: Spread summary for one fingerprint
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            The spread group for this fingerprint, including no_repeats when
            fewer than two terminal runs share it -- which includes a
            fingerprint whose only runs are still created or running:
            count 0, no_repeats true, in_flight set. Only terminal runs
            (succeeded, failed, cancelled) count toward count, metrics, and
            provenance; a created or running run is not a finished
            measurement, so it is reported only via in_flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpreadGroup"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No run at all -- of any status -- recorded with this
            fingerprint. A fingerprint that has at least one run, even a
            still-running one with no finished measurement yet, is a 200
            (see above), for consistency with GET /v1/fingerprints's
            min_runs=0 listing it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The store failed to answer the query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: Ready means the store answered a call, not just that the process is up.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Store is answering
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Store did not answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /metrics:
    get:
      operationId: metrics
      summary: Self-metrics in Prometheus exposition format
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Optional. Unset by default (single-user local ledger). When
        RUNLEDGER_TOKEN / RUNLEDGER_READ_TOKEN is configured, writes need the
        write token and reads accept either token.

  parameters:
    RunID:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    Status:
      type: string
      enum: [created, running, succeeded, failed, cancelled]

    RunInput:
      type: object
      additionalProperties: false
      required: [project, git_commit]
      properties:
        project:
          type: string
        git_commit:
          type: string
        git_dirty:
          type: boolean
        config_hash:
          type: string
          description: Required when git_dirty is true -- a dirty tree alone does not describe what ran.
        dataset_version:
          type: string
        model_version:
          type: string
        seed:
          type: integer
          format: int64
        params:
          type: object
          additionalProperties:
            type: string
        run_id:
          type: string
          description: Usually left unset; the server assigns one from the fingerprint.
        fingerprint:
          type: string
          description: >
            Accepted but ignored: the decoder does not reject this field, and
            the server always overwrites it with the identity fields' own
            computed hash. There is no way to assert a fingerprint from the
            client.
        fingerprint_version:
          type: integer
          description: >
            Accepted but ignored, the same as fingerprint: the server always
            overwrites it with the version of the hashing contract that
            actually produced the fingerprint it just computed. There is no
            way to assert an old contract's fingerprint was produced by
            today's.
        host:
          type: string
        device:
          type: string
        framework_version:
          type: string
        submitter_claim:
          type: string
          description: >
            The human or service account the caller says recorded this run.
            Self-asserted, not attested: the server has no per-caller
            identity to check this against (RUNLEDGER_TOKEN is one shared
            secret today). Treat it as a claim, not a verified fact. See
            ADR 0015.
        job_id:
          type: string
          description: >
            The CI job id, Slurm job id, or other scheduler-assigned
            identifier of the job that launched this run. One generic
            field for whatever a launcher calls its own unit of work.
        capture:
          allOf:
            - $ref: "#/components/schemas/CaptureDeclaration"
          description: >
            What the client attempted to capture when it wrote this run, not
            what it captured -- see ADR 0016. Omitted entirely means no
            declaration was sent at all, which is a different claim from a
            declaration that names nothing (see CaptureDeclaration). Not
            accepted by PATCH: a capture declaration describes what the
            recording client's own code tried, which it already knows in
            full at record time, so there is no legitimate "fill this in
            later" case the way there is for host/device/job_id.
        status:
          $ref: "#/components/schemas/Status"
        started_at:
          type: string
          format: date-time
          description: Defaults to the server's receive time when omitted.
        ended_at:
          type: string
          format: date-time
          description: Absent until the run ends -- never a zero-valued timestamp.
        checkpoint_uri:
          type: string
        metrics:
          type: object
          additionalProperties:
            type: number
            format: double

    # Run is deliberately a full standalone schema rather than
    # allOf: [RunInput, {...}] -- JSON Schema validates each allOf branch
    # independently, so RunInput's additionalProperties: false would reject
    # fingerprint/run_id as unknown even though a sibling branch added them.
    # Every real response would then fail validation against its own
    # documented schema. RunInput's field list is duplicated here rather
    # than shared, but the two schemas describe different things anyway: a
    # request the caller assembles versus a record the server hands back
    # with a handful of fields locked down.
    Run:
      type: object
      additionalProperties: false
      required:
        - project
        - git_commit
        - git_dirty
        - config_hash
        - dataset_version
        - model_version
        - seed
        - run_id
        - fingerprint
        - fingerprint_version
        - host
        - device
        - framework_version
        - submitter_claim
        - job_id
        - status
        - started_at
      properties:
        project:
          type: string
        git_commit:
          type: string
        git_dirty:
          type: boolean
        config_hash:
          type: string
          description: Required when git_dirty is true -- a dirty tree alone does not describe what ran.
        dataset_version:
          type: string
        model_version:
          type: string
        seed:
          type: integer
          format: int64
        params:
          type: object
          additionalProperties:
            type: string
        run_id:
          type: string
          readOnly: true
          description: Assigned by the server -- from the fingerprint, unless the request supplied one.
        fingerprint:
          type: string
          readOnly: true
          description: Content-addressed hash of the identity fields, computed by the server.
        fingerprint_version:
          type: integer
          readOnly: true
          description: >
            Which version of the fingerprint hashing contract produced
            fingerprint -- see the fingerprint-input-is-a-versioned-contract
            and param-normalization ADRs. 1 identifies a run recorded before
            params were normalized before hashing: its fingerprint hashes
            each param's literal string spelling, so "3e-4" and "0.0003"
            fingerprinted as different experiments. 2 identifies a run
            recorded after: a param value that parses as a finite decimal
            number is normalized to a canonical spelling before hashing, so
            those two spellings fingerprint identically. A version-1
            fingerprint is never recomputed under the version-2 contract --
            it keeps meaning exactly what it meant when it was recorded.
        host:
          type: string
        device:
          type: string
        framework_version:
          type: string
        submitter_claim:
          type: string
          description: >
            The human or service account the caller says recorded this run.
            Self-asserted, not attested: the server has no per-caller
            identity to check this against (RUNLEDGER_TOKEN is one shared
            secret today). Treat it as a claim, not a verified fact. Empty
            means not recorded, the same rule ADR 0011 states for the other
            scalar provenance fields. See ADR 0015.
        job_id:
          type: string
          description: >
            The CI job id, Slurm job id, or other scheduler-assigned
            identifier of the job that launched this run. One generic
            field for whatever a launcher calls its own unit of work. Empty
            means not recorded.
        capture:
          allOf:
            - $ref: "#/components/schemas/CaptureDeclaration"
          description: >
            What the client attempted to capture when it wrote this run, not
            what it captured -- a fact about the recording process, never
            hashed into fingerprint. Absent means no client ever sent a
            declaration for this run (every run recorded before this field
            existed, or a client that doesn't populate it) -- a different
            claim from a declaration present but naming nothing, which is
            why this is omitted rather than defaulted to an empty object.
            See ADR 0016.
        status:
          $ref: "#/components/schemas/Status"
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Absent until the run ends -- never a zero-valued timestamp.
        checkpoint_uri:
          type: string
        metrics:
          type: object
          additionalProperties:
            type: number
            format: double

    # ADR 0016: "did the client try to capture X" is a fact about the
    # recording process, not a value the experiment can take, so a nullable
    # value field can't hold it -- CaptureDeclaration is a small object kept
    # alongside the run for exactly that fact, and is never hashed.
    CaptureDeclaration:
      type: object
      additionalProperties: false
      properties:
        client:
          type: string
          description: >
            The client library and version that produced this declaration
            (e.g. runledger-py/0.1.0), so "did capture regress in client
            X.Y" is answerable directly from stored runs. Self-asserted the
            same way host and device already are.
        attempted:
          type: array
          items:
            type: string
            enum:
              - config_hash
              - dataset_version
              - model_version
              - host
              - device
              - framework_version
              - checkpoint_uri
          description: >
            Which of the seven fields ADR 0011 gives "" a single meaning for
            this client's recording code actively tried to determine,
            regardless of whether the attempt succeeded. A field's absence
            here means the client never looks for it at all -- distinct from
            looking and finding nothing, which is that field present here
            with an empty value on the run itself. Unrecognized names are
            rejected the same way an unrecognized status is.

    RunPatch:
      type: object
      additionalProperties: false
      description: >
        Every field is optional; only fields present in the request are
        applied. Identity fields may be sent only to confirm they match the
        stored run.
      properties:
        project:
          type: string
        git_commit:
          type: string
        git_dirty:
          type: boolean
        config_hash:
          type: string
        dataset_version:
          type: string
        model_version:
          type: string
        seed:
          type: integer
          format: int64
        params:
          type: object
          additionalProperties:
            type: string
        status:
          $ref: "#/components/schemas/Status"
        ended_at:
          type: string
          format: date-time
          description: >
            Optional on a terminal status transition (succeeded, failed,
            cancelled) -- the server defaults it to receive time when the
            request omits it.
        checkpoint_uri:
          type: string
        host:
          type: string
        device:
          type: string
        framework_version:
          type: string
        submitter_claim:
          type: string
          description: >
            Self-asserted, like the same field on RunInput/Run -- see ADR
            0015. Patchable because a run is often recorded before every
            provenance fact about it is known.
        job_id:
          type: string
        metrics:
          type: object
          additionalProperties:
            type: number
            format: double
          description: >
            Merged into the run's existing metrics map, not replaced -- a
            long run can report as it goes, and re-reporting an existing key
            overwrites just that key.

    RunPage:
      type: object
      required: [runs, count, limit]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        count:
          type: integer
        limit:
          type: integer
        next_cursor:
          type: string
          description: Present only when more rows may follow this page.

    CompareField:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [identity, provenance, metric]
        a:
          type: string
          nullable: true
          description: >
            The first run's value, or null if the run did not record this
            field. Null and "" are different answers: null means the field
            was never set, "" means it was set to the empty string. Only a
            param can be the latter -- for the scalar fields an empty value
            is not meaningful, so it is reported as null. See ADR 0011.
        b:
          type: string
          nullable: true
          description: The second run's value, on the same terms as `a`.

    CompareResult:
      type: object
      required: [a, b, same_experiment, fields, unattributable]
      properties:
        a:
          type: string
          description: run_id of the first run
        b:
          type: string
          description: run_id of the second run
        same_experiment:
          type: boolean
          description: True when the two runs' fingerprints match.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/CompareField"
        unattributable:
          type: boolean
          description: >
            True when same_experiment is true but a metric field still
            differs -- the record claims two identical experiments that
            measured differently.

    MetricStat:
      type: object
      required: [count, min, max, mean, stddev]
      properties:
        count:
          type: integer
        min:
          type: number
        max:
          type: number
        mean:
          type: number
        stddev:
          type: number

    ProvenanceDiff:
      type: object
      properties:
        field:
          type: string
        values:
          type: array
          items:
            type: string

    SpreadGroup:
      type: object
      required: [fingerprint, run_ids, count, no_repeats, in_flight]
      properties:
        fingerprint:
          type: string
        run_ids:
          type: array
          items:
            type: string
          description: >
            Terminal (succeeded, failed, cancelled) runs only -- an
            in-flight run is counted in in_flight, not listed here.
        count:
          type: integer
          description: Number of terminal runs with this fingerprint.
        no_repeats:
          type: boolean
          description: True when fewer than two terminal runs have this fingerprint; metrics is omitted in that case.
        in_flight:
          type: integer
          description: >
            Number of this fingerprint's runs that are not yet terminal
            (created or running). Reported so a run still in progress is
            visible rather than either silently dropped or miscounted as a
            finished repeat.
        metrics:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MetricStat"
        provenance:
          type: array
          items:
            $ref: "#/components/schemas/ProvenanceDiff"

    SpreadGroupList:
      type: object
      required: [groups, count, limit]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/SpreadGroup"
        count:
          type: integer
        limit:
          type: integer
        next_cursor:
          type: string
          description: Present only when more groups may follow this page.

    Error:
      type: object
      required: [error, code, request_id]
      properties:
        error:
          type: string
        code:
          type: string
          description: >
            A stable, machine-readable identifier for the failure, distinct
            from the human-readable error string above -- e.g.
            identity_conflict, illegal_transition, id_taken, unknown_status,
            not_found, invalid_cursor, bad_request, unauthenticated. New
            codes may be added over time; a client should treat one it does
            not recognize as it would any other error.
        request_id:
          type: string
          description: >
            Echoes the X-Request-Id response header, so a report referencing
            one also identifies the other.
