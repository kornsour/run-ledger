[project]
name = "runledger"
version = "0.1.0"
description = "Record an experiment run's lineage from inside training code, without shelling out to rlctl."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Only for building the docs artifacts (the executed notebook and the pdoc
# reference). Deliberately not a runtime dependency: the client itself is
# standard-library only, and a training container should not have to install
# jupyter to record a run.
docs = ["nbconvert>=7", "ipykernel>=6", "matplotlib>=3.7", "pdoc>=14"]

[project.urls]
Homepage = "https://github.com/kornsour/run-ledger"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runledger*"]

# PEP 561: without a shipped py.typed marker, a type checker running over a
# *consumer's* code must ignore this package's annotations entirely. The
# annotations are the client's machine-readable contract, the same role
# docs/openapi.yaml plays for the HTTP surface, so they have to reach callers.
[tool.setuptools.package-data]
runledger = ["py.typed"]
