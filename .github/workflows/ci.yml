name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted, and not negotiable while this repo is public: a fork PR
    # must never execute on self-hosted hardware, and public repos get hosted
    # minutes free, so there is nothing to trade for.
    #
    # This job runs `make image`, a real `docker build`. ubuntu-latest ships a
    # working Docker daemon, so it needs nothing special -- but that IS a
    # requirement of the job, not an accident. Any future runner for it must
    # have a non-nested Docker daemon; a container-based runner fails here with
    # "make: docker: No such file or directory", which is a structural
    # incompatibility rather than a flake.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: make build
      - name: Build image
        run: make image

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test
        run: python3 -m unittest discover -s python/tests -v
      # examples/churn is standard library only, so it needs no install step
      # of its own -- including this repo's Python client. The scenario it
      # backs is exercised by `make example`, not here; these are the unit
      # tests for the capture detector.
      - name: Test the example
        run: python3 -m unittest discover -s examples/churn -v
      - name: Test the dashboard data layer
        run: python3 -m unittest discover -s dashboard/tests -v

  notebook:
    # The notebook is documentation that makes a claim -- same fingerprint,
    # different metrics -- so it is executed here against a real ledger
    # rather than trusted. Committed outputs are stripped (enforced by
    # test_notebook.py), which means nothing in git records whether it still
    # runs; this job is that record.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the client and its docs tooling
        run: pip install -e './python[docs]'
      - name: Execute the notebook and build the reference
        run: make docs
      - name: Upload the rendered pages for inspection
        # So a reviewer can read the executed notebook on a PR, where the
        # Pages deploy (main only) has not run.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-docs
          path: |
            docs/reproducibility.html
            docs/python/
          retention-days: 7
