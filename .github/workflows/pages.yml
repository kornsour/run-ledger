name: Pages

# Publishes https://kornsour.github.io/run-ledger/.
#
# The site is built here rather than served straight from docs/ because half
# of it is generated: the API reference renders docs/openapi.yaml, the
# notebook page is the executed notebook, and docs/python/ is pdoc output.
# Building at deploy time keeps every generated artifact out of git, so none
# of them can sit in the repo asserting a result nothing re-verified.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-flight: the site would be left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the client and its docs tooling
        run: pip install -e './python[docs]'
      - name: Build the generated pages
        # Executes the notebook against a real ephemeral ledger and runs
        # pdoc. A notebook that has stopped working fails the deploy rather
        # than publishing a stale page.
        run: make docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
